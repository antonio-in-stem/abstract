id = '''DTE-07'''
area = '''docs-tests-examples'''
title = '''Brace file patterns with more than one brace group silently produce corrupt paths; braces in a plain text value are silently stripped'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/docs-tests-examples/brace-multigroup/'''
command = '''cd .../repro/docs-tests-examples/brace-multigroup && abstract compile data JSON --skip-assets
files: ./x/{hero,thumb}/{small,large}.png
label: {name}.png
text(1..60)'''
expected_kind = '''error'''
expected_note = '''Either a 4-element cross product `./x/hero/small.png … ./x/thumb/large.png`, or a compile error saying multiple brace groups are unsupported. `label: {name}.png` on a text field should stay `{name}.png` (or error).'''
actual_0_2_0 = '''exit 0 with `"files": ["./x/hero.png", "./x/thumb}/{small,large.png"]` — the first element silently lost its `/small|large` path segment and the second is not a path at all; and `"label": "name.png"` — the braces were silently deleted from a plain text value.'''
spec_ref = '''3.5, 3.6, 5.5, 5.8, 5.10, 10.4 (E434, E435)'''
status = '''ready'''
expectation_1_0 = '''
compile data JSON --skip-assets -> expected.json  (--skip-assets changes nothing here)
1.0 makes brace expansion type-directed: only a file or image LIST field expands a brace
pattern (5.8). "files" is text[] and "label" is text, so the braces are ordinary characters
in both. The commas inside a brace group do not split the value into list items, because
bare_text must contain balanced brackets and no comma at bracket depth 0 of the value
(GRAMMAR bare_text, and 5.8 which reads the alternatives of one group out of one value);
"files" therefore holds one element and is list-coerced (5.10).
'''
