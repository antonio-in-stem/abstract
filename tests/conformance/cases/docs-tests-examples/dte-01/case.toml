expectation_1_0 = '''
compile data JSON (cwd = case root)                -> expected-error.txt
compile data JSON (cwd = dte-01/data-field-name)   -> data-field-name/expected.json
1.0 removes the 0.2.0 "data:" sentinel (A.1 A1), so "data" is an ordinary field name and
every statement is parsed. The primary tree still fails, but for a different reason: line 7
("!!! total garbage ((( unterminated ") is not a statement. Both candidate diagnostics are
E2xx and therefore in the same precedence group, so 11.1 rule (3) decides by position:
E210 at 7:1 (unexpected token) precedes E201 at 7:31 (unterminated string). Because P1
fails, the E409 that "data:" would raise in the primary tree is never reached.
data-field-name compiles and emits "data" under its declared name.
'''
