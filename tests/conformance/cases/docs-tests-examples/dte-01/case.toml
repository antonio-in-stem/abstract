actual_0_2_0 = '''data-truncation: exit 0, output contains ONLY instance `a` with `name: "Alpha"`; the second instance `T :: @id.b`, the `note:` line, and the deliberately broken garbage line are all silently gone. data-field-name: exit 1 with `abstract: items/a.ab: Missing required field T.data. Add 'data: ...' to the instance, ...` — while line 2 of that very file reads `    data: payload`. The `name: Alpha` on line 3 was also dropped.'''
spec_ref = '''2.4, 3.1, 3.5, 3.6, 5.4, 7.1, 10.2, 11.1, A.1 (A1)'''
