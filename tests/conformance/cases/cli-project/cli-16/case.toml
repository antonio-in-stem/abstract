../../project/target/release/abstract.exe compile case-junc-escape/data JSON'''
expected_kind = '''document'''
expected_note = '''A directory cycle is detected and reported as a cycle ('symlink loop at data/loop'); links that leave the project root are skipped or reported.'''
actual_0_2_0 = '''Cycle: 775 bytes of "abstract: loop/loop/loop/.../templates/Item.abt: Duplicate schema 'Item'. It is already defined in 'loop/loop/...'" (125 'loop/' segments), exit 1. Escape: exit 0 with "id": "outsider" from outside the compiled tree.'''
spec_ref = '''2.4'''
status = '''ready'''
command_1_0 = '''compile data JSON   (variant: compile case-junc-escape/data JSON)'''
expected_1_0 = '''The junctions were recreated for this case: data/loop points at data/ and case-junc-escape/data/link points at case-junc-escape/outside/. The walker resolves links and junctions and keeps a set of canonical directory paths already visited, skipping any directory already in it (SPEC 2.4), so the loop terminates and every file is collected once: the primary tree compiles to one object. The escape variant compiles to one object too, and it is the outsider: SPEC 2.4 requires links to be resolved and deduplicated, and it does not say that a link leaving the project root is skipped, so its content is discovered through the link. That is a deliberate departure from the 0.2.0-era expected_note above, which asked for such links to be skipped.'''
