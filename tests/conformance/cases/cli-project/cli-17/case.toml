expected_1_0 = '''A named path that does not exist is E806 with the message Input not found (SPEC 9.2), exit code 2, and never a raw localised operating-system string: SPEC 9.8 fixes the diagnostic format, and paths in diagnostics are project-relative with forward slashes. The other invocations of this finding: lint no-such-dir and templates no-such-dir are E806 as well, since all three commands share one path-resolution rule; compile data/items/zzz.ab JSON is E806; no-such-dir/x.ab JSON has no command word and is E801, because the three-argument direct form is removed (Appendix A53); compile case-outfail/data JSON --out case-outfail/nope/out.json is E810 with exit code 3, because the parent directory must exist (SPEC 9.4). The junction under case-junc-escape/data was recreated for the unbundle sub-invocation, which is optional tooling (SPEC 9.9).'''
