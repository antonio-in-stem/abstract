id = '''cli-24'''
area = '''cli-project'''
title = '''Direct form: the trailing `true` must sit immediately after the format token or it is parsed as an input path'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/cli-project/case-order/'''
command = '''../../project/target/release/abstract.exe case-order/a.ab case-order/Item.abt true JSON --allow-unknown
... case-order/a.ab case-order/Item.abt JSON true --allow-unknown'''
expected_kind = '''error'''
expected_note = '''Either both forms are order-independent, or the misplaced literal 'true' produces a usage error naming the expected order.'''
actual_0_2_0 = '''abstract: Input file not found: 'true'. / Current directory: ... / Resolved path: ...\true / Fix: run the command from the folder that contains the file... (exit 1). Correct order writes case-order/a.json.'''
spec_ref = '''9.1, 9.2, 9.6, 10.8'''
status = '''ready'''
command_1_0 = '''a.ab Item.abt true JSON --allow-unknown'''
expected_1_0 = '''A command word is always required and there is no direct form (SPEC 9.1, Appendix A53), so the first token is an unknown command: E801, exit code 2. The ordering question disappears with the form that raised it. The trailing write flag is gone too, replaced by --out (Appendix A58), and --allow-unknown is removed with no replacement (Appendix A52), so the unknown field extra in a.ab could no longer be hidden even if the invocation parsed.'''
