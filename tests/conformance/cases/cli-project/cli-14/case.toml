id = '''cli-14'''
area = '''cli-project'''
title = '''Requesting a file with no instances silently emits the entire directory instead'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/cli-project/case-scope/'''
command = '''../../project/target/release/abstract.exe compile case-scope/data/a.ab JSON
... compile case-scope/data/empty.ab JSON
... compile case-scope/data/Item.abt JSON'''
expected_kind = '''document'''
expected_note = '''Asking for a specific file yields that file's instances (possibly zero) - never a wider set.'''
actual_0_2_0 = '''empty.ab and Item.abt both produce the full directory output ('id': 'a', 'id': 'b'), exit 0.'''
spec_ref = '''2.5, 8.1, 9.2, 10.8'''
