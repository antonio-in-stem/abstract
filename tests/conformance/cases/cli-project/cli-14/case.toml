command_1_0 = '''compile data/empty.ab JSON   (also: compile data/a.ab JSON, which emits only a; compile data/Item.abt JSON, which is E806)'''
expected_1_0 = '''Naming a file selects that file and never a wider set (SPEC 2.5), so a file that declares no instances yields an empty data array, which SPEC 8.1 states is reachable exactly here. The other instances are still parsed and validated, they are simply not emitted. Naming a template file is E806, because a template declares no instances and so can never select output. data/notes.txt is not a source and is never read.'''
