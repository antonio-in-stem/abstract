expected_1_0 = '''Single-file mode discovers the whole project and emits only the named file (SPEC 2.5): the project root is found by walking up to the nearest data directory (SPEC 2.3), so data/templates/Item.abt resolves. rarity comes from the header tag, price, tradable, stats.power and stats.agility from the authored value and the defaults, and release_wave from derive? .release_wave = 1, which is legal because the field declares no default (SPEC 6.4). NOTE ON THE SCAFFOLD: pack.ab sits beside data/ rather than inside it, so it is outside the discovery root and is never read; a 1.0 abstract init must place every source under data/, because SPEC 9.2 requires compile and lint on a fresh scaffold to succeed.'''
