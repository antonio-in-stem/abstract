expected_1_0 = '''The invocation that produced this finding was the three-argument direct form, which is removed (Appendix A53); its replacement resolves the project by walking up to the data directory, so the asset is found and the primary tree simply compiles. The message defect is closed by SPEC 9.8 and SPEC 5.9 together: diagnostics print the source path relative to the project root with forward slashes, absolute, canonical and extended-length platform paths must not appear, and the resolved asset path is printed in project-relative form. The case-assets-in-data variant is the runnable proof, because it is the one that still produces a path in a diagnostic.'''
