id = '''cli-10'''
area = '''cli-project'''
title = '''`.AB` / `.ABT` files are silently invisible to the compiler on Windows'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/cli-project/case-ext/'''
command = '''../../project/target/release/abstract.exe compile case-ext/data JSON
../../project/target/release/abstract.exe compile case-ext/data/items/UPPER.AB JSON
../../project/target/release/abstract.exe templates case-ext/data'''
expected_kind = '''document'''
expected_note = '''Extension matching is case-insensitive (or a file with a differently-cased .ab/.abt extension produces a warning rather than being ignored).'''
actual_0_2_0 = '''compile emits only id 'good'; templates prints only 'Item'; compiling UPPER.AB directly compiles the sibling good.ab and dies with 'a.ab:1: Unknown template' (the wrong file entirely).'''
spec_ref = '''2.1, 2.4, 2.6, 2.7, 9.2'''
status = '''ready'''
command_1_0 = '''compile data JSON   (also: compile data/items/UPPER.AB JSON, which emits only upper; templates data, which prints Item then Other)'''
expected_1_0 = '''Extensions are compared case-insensitively (SPEC 2.1, 2.6), so data/items/UPPER.AB and data/templates/Other.ABT are ordinary sources. Both instances are emitted, ordered by (template, id) (SPEC 2.7). Naming UPPER.AB selects that file and no other (SPEC 2.5), which is the fix for compiling the wrong sibling. Other declares no instances, which is legal.'''
