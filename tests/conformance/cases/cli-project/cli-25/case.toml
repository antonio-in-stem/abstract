expected_1_0 = '''The last positional is the format only when at least one other positional is present, so compile json JSON reads json as the input directory, and a sole positional is always an input path, so compile json does too (SPEC 9.2). The directory has no data directory above or below it, so it is itself the project root and the discovery root (SPEC 2.3). A directory whose name is a format keyword can be compiled only as the sole positional or with the format spelled out; naming it alongside another input path is not expressible, and SPEC 9.2 states that explicitly.'''
