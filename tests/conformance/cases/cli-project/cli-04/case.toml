command_1_0 = '''compile data/items/starter_sword.ab data JSON   (variant: compile case-overlap-roots/data/items/a.ab case-overlap-roots/data JSON)'''
expected_1_0 = '''Naming a directory and a file in one invocation is E807 (SPEC 2.5, 9.2), exit code 2, so the overlapping-roots situation that produced the bogus duplicate-id message is not expressible. The underlying dedup rule still holds for everything that is expressible: discovery collects a file once by canonical path (SPEC 2.4), so a file reachable by two paths never yields E402 against itself.'''
