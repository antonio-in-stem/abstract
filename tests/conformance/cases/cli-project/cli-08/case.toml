id = '''cli-08'''
area = '''cli-project'''
title = '''`bundle --key <pass> --plain` silently writes an UNENCRYPTED bundle'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''security'''
source_repro = '''repro/cli-project/case-bundle/'''
command = '''../../project/target/release/abstract.exe bundle case-bundle/data --key "release passphrase" --plain --out case-bundle/both.abx
grep -c TOP_SECRET_VALUE case-bundle/both.abx
../../project/target/release/abstract.exe unbundle case-bundle/both.abx'''
expected_kind = '''error'''
expected_note = '''Passing both --key and --plain is a usage error ('--plain cannot be combined with --key').'''
actual_0_2_0 = '''exit 0, 'abstract: wrote case-bundle/both.abx (132 bytes, 1 item(s), plain)'; grep finds TOP_SECRET_VALUE in the file, and `unbundle` with no key prints the full JSON. The sealed variant contains 0 matches and refuses to open without a key.'''
spec_ref = '''9.9, Appendix D.1'''
status = '''manual'''
resolution_1_0 = '''SPEC 9.9 places bundle outside the language and outside conformance, and SPEC 10 catalogues language diagnostics only, so the refusal carries no Exxx identifier. Appendix D.1 item 1 binds the behavior, and the reference implementation refuses the invocation with exit code 2 and writes no container. Covered by tests/cli_tests.rs::bundle_flag_errors_keep_their_wording_and_exit_code rather than by a corpus golden, because the runner compares catalogue identifiers.'''
command_1_0 = '''bundle data --key <passphrase> --plain --out both.abx'''
expected_1_0 = '''Appendix D.1 item 1 makes --key together with --plain a usage error and forbids writing an unencrypted container while a key was given, but SPEC 9.9 places bundle outside the language and outside conformance, and SPEC 10.8 defines no identifier for two mutually exclusive flags. The behavior is fixed: refuse, exit 2 and write nothing. data/abstract.abx is not an input to the case.'''
