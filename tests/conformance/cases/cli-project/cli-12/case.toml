id = '''cli-12'''
area = '''cli-project'''
title = '''`--out` overwrites any existing file, including project sources, with no guard or confirmation'''
severity = '''design'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/cli-project/case-out/'''
command = '''../../project/target/release/abstract.exe compile case-out/data JSON --out case-out/data/Item.abt
head -3 case-out/data/Item.abt'''
expected_kind = '''error'''
expected_note = '''Refuse to write output over a .ab/.abt source file (or over any file that was read during this compile) without an explicit --force.'''
actual_0_2_0 = ''''abstract: wrote case-out/data/Item.abt (json)', exit 0; the schema file now contains JSON and the next compile fails with 'a.ab:1: Unknown template Item'.'''
spec_ref = '''9.4, 9.6, 10.8'''
status = '''ready'''
command_1_0 = '''compile data JSON --out data/Item.abt'''
expected_1_0 = '''The destination lies inside the data directory and would also be an .abt file inside the discovery root, so it is refused with E808 and exit code 2 (SPEC 9.4). The refusal is decided from the project resolution of SPEC 2.3 alone, before any source is parsed, so nothing is written and no compilation diagnostic is produced. NOTE: data/Item.abt in this tree still holds the JSON that the 0.2.0 run wrote over it; that is deliberate as a record of the damage, and it does not change the outcome, because the destination check precedes parsing.'''
