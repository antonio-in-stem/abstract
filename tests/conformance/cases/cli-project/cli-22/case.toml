id = '''cli-22'''
area = '''cli-project'''
title = '''An `assets/` folder placed inside `data/` is unreachable and the error never explains the parent-of-data rule'''
severity = '''minor'''
verdict = '''partial'''
kind = '''ux'''
source_repro = '''repro/cli-project/case-assets-in-data/'''
command = '''../../project/target/release/abstract.exe compile case-assets-in-data/data JSON'''
expected_kind = '''error'''
expected_note = '''Either data/assets is searched too, or the error says 'project root resolved to <X> because the compiled folder is named data; assets are looked up under <X>/assets'.'''
actual_0_2_0 = '''abstract: a.ab: File not found at Item.icon: './assets/textures/icon.png' resolved to '\\?\C:\...\case-assets-in-data\assets\textures\icon.png'. (exit 1)'''
spec_ref = '''2.3, 5.9, 9.5, 10.4'''
status = '''ready'''
command_1_0 = '''compile data JSON'''
expected_1_0 = '''The assets directory is the project root assets directory, and the project root is the parent of the data directory, so an assets/ folder inside data/ is not searched: there is exactly one resolution rule and the assets/ prefix is not special-cased (SPEC 2.3, 5.9). The value resolves to a path under the project root that does not exist, which is E421. E421 must carry the note naming the assets directory and the parent-of-data rule, which is the only place this layout mistake is explained. --skip-assets would suppress this diagnostic without changing any emitted byte.'''
