expected_1_0 = '''Both spellings of --out are supported (SPEC 9.3). expected.json holds the bytes written to out1.json, which are exactly the bytes that would have gone to stdout; with --out nothing at all is written to stdout and one informational line naming the path and the format goes to stderr (SPEC 9.4, 9.7). out1.json is neither a source file nor inside the data directory, so it is not refused. --out= with an empty value would be E803.'''
