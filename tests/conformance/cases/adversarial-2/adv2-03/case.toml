id = '''ADV2-03'''
area = '''adversarial-2'''
title = '''A body-statement `@since(0)` below the project minimum reports E430 instead of E603'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''bug'''
expected_kind = '''error'''
spec_ref = '''4.12, 5.13, 10.6, 11.1'''
expected_note = '''SPEC 4.12 requires min <= n <= max for every version annotation, so `@since(0)` in a project declared `versions 1..3` is E603 ("Version 0 is outside the project range 1..3."). SPEC 4.12 also fixes the project minimum at 1 (E602), so 0 can never be a legal annotation argument in any project.'''
actual_1_0 = '''exit 1 with
  data/items/x.ab:3:5: error[E430]: This statement can never apply: v exists in versions 1..3, the statement is annotated none.
The reported condition is false: the statement does not contradict the field, it names a version the project does not have.'''
status = '''ready'''
note_1_0 = '''The lower-bound half of the gap reported in ADV2-01. VersionRange::new rejects a minimum below 1, so the window resolves to None and the out-of-range number is reported as an empty applicability set.'''
