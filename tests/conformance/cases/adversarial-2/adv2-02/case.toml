id = '''ADV2-02'''
area = '''adversarial-2'''
title = '''A body-statement `@removed(n)` above the project range is silently accepted'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''bug'''
expected_kind = '''error'''
spec_ref = '''4.12, 5.13, 7.2, 10.6, 11.1'''
expected_note = '''SPEC 4.12: "n MUST be within the project range (min <= n <= max), otherwise E603". `@removed(9)` in a project declared `versions 1..3` is E603, reported at the annotation. This is the worst shape of the gap ADV2-01 describes, because `@removed(9)` intersects the project range to the whole range: the annotation is not merely misreported, it has no effect at all and the compile succeeds.'''
actual_1_0 = '''exit 0. The document is byte-identical to the one the same statement produces with no annotation at all. A typo such as `@removed(9)` for `@removed(2)` therefore ships a wrong document with no diagnostic, which is exactly the class of silent behaviour SPEC 1.2 and the R4-5 decision ("nothing in the language is silent") rule out.'''
status = '''ready'''
note_1_0 = '''Same root cause as ADV2-01: src/resolve.rs check_statements never range-checks statement.window. VersionWindow::resolve clips to the project range, which hides an out-of-range @removed entirely and turns an out-of-range @since into an empty set.'''
