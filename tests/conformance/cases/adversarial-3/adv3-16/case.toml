expected_note = '''SPEC 10.5's E523 row prescribes the message and "a note at the instance header". SPEC 9.8 permits zero or more note lines, so the extra notes are not illegal, but they are not described either, and SPEC 11.2 compares a case's `err.txt` byte for byte, which makes them normative once any suite pins them. At the limit of SPEC 3.7's 64-deep block nesting the tail is 63 notes, all of them naming loops that are already implied by the position. Either SPEC 10.5 names the tail or E523 drops it; the case is pending because that is a specification decision.'''
actual_1_0 = '''exit 1, with the diagnostic followed by `note: instance 'x'.` and four `note: at index 0, item 1.` lines, one per enclosing `for`. Nine chains cost 999 990, so the crossing charge falls on the seventh iteration of the tenth chain's innermost loop, four levels down.'''
note_1_0 = '''src/logic.rs::loop_notes appends one note per live loop binding to every diagnostic the evaluator raises. It reads well on E522, where the loop item is the subject; on E523 the position already names the loop.'''
