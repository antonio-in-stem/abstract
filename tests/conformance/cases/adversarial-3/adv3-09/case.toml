expected_note = '''SPEC 8.1, as revision 7 rewrote it, says an empty `data` array "is reachable in exactly two ways" - single-file mode over files that declare no instances, and "a whole-project compile of a project whose sources declare schemas but no instances" - and that a project with no source files at all is E103 instead. This project is none of the three: discovery collects one file, so it is not E103, and that file declares no schema, so it is not the second bullet either. It compiles, and the enumeration in SPEC 8.1 has to admit it.'''
actual_1_0 = '''exit 0, with `data` and `overlays` both empty.'''
note_1_0 = '''The behaviour is right; the sentence that counts the ways is wrong. Widening the second bullet to "a whole-project compile that discovers source files and no instance" covers the empty file, a comment-only file and ADV3-10's `versions`-only file, and leaves the E103 sentence untouched.'''
