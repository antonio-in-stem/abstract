spec_note = '''0.2.0-only source: 1.0 rejects it for a reason unrelated to the original finding. leak.ab opens with "&base.slug" before its header, which is E403 (5.1), a P1 diagnostic; a phase runs only if every earlier phase succeeded (7.1), so the E424 that abs.ab's absolute "C:/..." value would raise in P4 is masked. 5.9 is what closes the sandbox in 1.0: a file/image value must be relative, must contain no ".." segment and must have no drive, UNC or leading-separator prefix, and interpolation cannot smuggle one in because the resolved path is checked after interpolation (7.3 steps 2-3).'''
