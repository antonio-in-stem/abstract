actual_0_2_0 = '''EXIT=0. leak emits "doc": "./../private/keys.txt" (the compiler confirmed the out-of-sandbox file exists), abs emits the absolute path to a file outside the project. With one more `../` (earlier run) the resolved path was reported as '\\?\C:\...\repro\instances-merge\private\keys.txt' — outside the compiled project entirely.'''
spec_ref = '''5.1, 5.7, 5.9, 7.1, 10.4 (E403)'''
