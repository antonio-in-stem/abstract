id = '''IM-03'''
area = '''instances-merge'''
title = '''Compiled output can contain duplicate `id` values; the documented uniqueness guarantee is not enforced on the emitted id'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/instances-merge/im-11/'''
command = '''`abstract compile data JSON` ; `abstract lint data` ; `abstract compile data YML` ; then `abstract compile data JSON --out out.json` and `java -cp <scratchpad>/jout Drv out.json` against the compiled java/ runtime.'''
expected_kind = '''undecided'''
expected_note = '''Duplicate id 'shared' rejected (same error as tests/compiler_tests.rs:1038 duplicate_instance_ids_are_rejected).'''
actual_0_2_0 = '''JSON: two objects both with "id": "shared" (names A and B), EXIT=0. YAML: same. `abstract lint data` prints `abstract: ok` (EXIT=0). Java runtime: `items=2 / item id=shared name=A / item id=shared name=B / get("shared") -> name=B` — instance A is unreachable by id.'''
spec_ref = '''4.11, 5.3, 5.4, 10.4 (E410)'''
status = '''ready'''
spec_note = '''"id: shared" is a statement whose leading path segment is "id", which is E410 (5.4). Because the emitted id can only come from the header or the file stem (5.3), the registry id and the emitted id can never diverge and the duplicate this input produced in 0.2.0 is unreachable.'''
