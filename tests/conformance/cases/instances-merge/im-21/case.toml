spec_note = '''0.2.0-only source: both trees are rejected for a reason unrelated to the original finding, because every "&base.<path>" is written before its instance header, which is E403 (5.1). Root tree: child.ab and child2.ab each raise one, ordered by the sorted source path of 2.4. The finding itself is answered by 5.7: a clone copies the source's authored data after its own clones and before defaults, interpolation and logic, so "&base.rank" - a field only a derive writes - is E408 with the message "Clone path ... does not exist on instance ... in any version", which is precise rather than misleading.'''
