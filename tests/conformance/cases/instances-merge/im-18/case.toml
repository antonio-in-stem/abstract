id = '''IM-18'''
area = '''instances-merge'''
title = '''Interpolation has no variable-name boundary: a mistyped `$named` silently becomes the value of `$name` plus the leftover characters'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''ux'''
source_repro = '''repro/instances-merge/im-29/'''
command = '''`abstract compile data JSON`'''
expected_kind = '''undecided'''
expected_note = '''`$named` either resolves to a field called `named` or errors as an unknown variable; only `${name}d` should splice.'''
actual_0_2_0 = '''EXIT=0 with "label": "./icons/Wind.png" — `$name` was substituted inside `$named`, silently yielding 'Wind'. ("icon" became "./icons/x_small.png", which happens to be what an author wants, showing the same rule cuts both ways with no way to tell them apart.)'''
spec_ref = '''5.11, 10.4 (E425)'''
status = '''ready'''
spec_note = '''"$name" consumes the maximal following run of identifier characters (5.11), so "$named" names the variable "named" and "$id_small" names "id_small"; neither exists, so each statement raises E425 and a misspelling never survives into output. The two diagnostics are ordered by source position; only the first is mandated when a single diagnostic is reported (11.1). "${id}_small" is the spelling that means "id" followed by "_small".'''
