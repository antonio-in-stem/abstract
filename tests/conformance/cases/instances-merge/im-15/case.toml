id = '''IM-15'''
area = '''instances-merge'''
title = '''A UTF-8 BOM breaks .ab parsing and silently prevents a .abt schema from being registered'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/instances-merge/im-20/'''
command = '''`abstract compile data JSON`. (An earlier run in the same directory with a BOM'd .ab file produced the instance-side error.)'''
expected_kind = '''undecided'''
expected_note = '''BOM stripped on read; both files parse normally.'''
actual_0_2_0 = '''BOM'd .abt: `abstract: things/o1.ab:1: Unknown template 'Other'. Add a schema named 'Other' in a .abt file, or change this instance header to an existing schema.` (EXIT=1) — blames the wrong file.\nBOM'd .ab: `abstract: things/bom.ab:1: statement '\u{feff}Thing :: @id.bom' appears before any instance header (expected 'Template :: ...' first)` (EXIT=1).'''
spec_ref = '''2.2, 2.4, 8.1'''
status = '''ready'''
spec_note = '''2.2: a BOM at offset 0 is removed before lexing and has no other effect, so Other.abt registers its schema normally. A schema with no instances is not an error; the document simply carries the one instance that exists.'''
