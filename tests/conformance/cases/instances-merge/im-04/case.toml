expected_note = '''`@id.42` either rejected ('instance id must be text') or treated as the string "42" and the alpha/beta collision reported as a duplicate id.'''
actual_0_2_0 = '''EXIT=0 with four objects: two with "id": 42, one with "id": 7 (leading zeros lost), one with "id": true. YAML emits the same native types. `abstract lint data` prints `abstract: ok`. Java runtime resolves all of these through getString("id","").'''
spec_ref = '''2.4, 5.2, 5.3, 7.2 (P2), 10.4 (E402, E428)'''
status = '''ready'''
spec_note = '''Numeric ids are ordinary identifiers (3.3, 5.3), so "@id.42" is the string "42" and "@id.007" is "007"; they do not bypass the registry. beta.ab repeats "42": E402. delta.ab writes "@id" as a bare flag, which 5.2 makes E428 ("an instance's identity is never the boolean true"). Both are P2 diagnostics, ordered by the sorted source path of 2.4 (data/things/beta.ab before data/things/delta.ab), so E402 is first and is the only one mandated when a single diagnostic is reported (11.1).'''
