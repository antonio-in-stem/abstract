id = '''IM-01'''
area = '''instances-merge'''
title = '''Any statement starting with `data:` silently truncates the rest of the .ab file'''
severity = '''critical'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/instances-merge/im-1/'''
command = '''`abstract compile data JSON` ; also `abstract lint data`'''
expected_kind = '''undecided'''
expected_note = '''Either `data` is a normal field name and all four assignments are applied (name Widget, data payload-one, tier 7, note ...), or the compiler errors explaining that `data:` is reserved at top level in .ab files.'''
actual_0_2_0 = '''{"data":[{"template":"Thing","id":"widget","name":"Widget","tier":1}]} with EXIT=0. `data`, `tier: 7` and `note` were dropped; tier silently reverted to its schema default 1. `abstract lint data` prints `abstract: ok` (EXIT=0).'''
spec_ref = '''4.1, 4.11, 5.4, 8.3, Appendix A'''
status = '''ready'''
spec_note = '''The "data:" sentinel does not exist in 1.0; only "template" and "id" are reserved (4.11). Every statement of the instance is assigned and the key order is the schema's declaration order (8.3). The schema declares no "id" field, so the implicit "id: text(1..64)" applies (4.11).'''
