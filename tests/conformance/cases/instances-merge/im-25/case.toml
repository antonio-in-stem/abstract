id = '''IM-25'''
area = '''instances-merge'''
title = '''An instance id containing a dot cannot be used as a partial-clone target'''
severity = '''design'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/instances-merge/im-26/'''
command = '''`abstract compile data JSON`'''
expected_kind = '''undecided'''
expected_note = '''Either dots rejected in ids, or a way to write the partial clone (e.g. `&"my.thing".name`).'''
actual_0_2_0 = '''`abstract: things/copier.ab:1: Unknown clone target 'my'. Clone references such as '&my.*' resolve by instance id; make sure the source .ab is available next to this file or inside the compiled project.` (EXIT=1)'''
spec_ref = '''4.10, 5.2, 5.3, 5.6, 10.4 (E428)'''
status = '''ready'''
spec_note = '''The header tag name ends at the first "." after the identifier run, so the value of "@id" is "my.thing", which is not an identifier: E428 (5.2, 5.3). An id therefore never contains a "." and the clone-path ambiguity the finding describes cannot arise. The schema's wildcard default "= hat_*" is legal: a default is a value validated at schema time (4.10) and wildcard expansion is part of interpreting a value against an enum list type (5.6, 5.10).'''
