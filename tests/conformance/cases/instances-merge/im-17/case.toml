spec_note = '''0.2.0-only source: 1.0 rejects it for a reason unrelated to the original finding. The "&base.icon" on line 1 of child.ab precedes the header, which is E403 (5.1). The finding itself is closed by 5.7 and 5.11: a clone copies the source's authored data before interpolation, and "$" references are resolved after all clones are merged, against the cloning instance's variable table, so no un-interpolated "$var" can reach the output.'''
