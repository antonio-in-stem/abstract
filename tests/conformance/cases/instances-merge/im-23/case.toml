id = '''IM-23'''
area = '''instances-merge'''
title = '''A clone across templates silently smuggles the source template's fields into the target under --allow-unknown, and the rejection message lists 'template, id' as declared schema fields'''
severity = '''design'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/instances-merge/im-7/'''
command = '''`abstract compile data JSON` ; `abstract compile data JSON --allow-unknown`'''
expected_kind = '''error'''
expected_note = '''Cloning across templates either rejected up front ('cannot clone Alpha instance a1 into Beta instance b1') or, at minimum, an error naming the clone as the source of the extra field.'''
actual_0_2_0 = '''Without the flag: `abstract: things/b1.ab: Unknown field 'secret' at Beta. Declared fields: name, template, id.` (EXIT=1) — no mention of the clone, and 'template, id' listed as declared fields.\nWith --allow-unknown: EXIT=0 and the Beta instance emits "secret": "classified".'''
spec_ref = '''5.1, 5.7, 5.12, 10.4 (E403, E407)'''
status = '''ready'''
spec_note = '''0.2.0-only source: 1.0 rejects it for a reason unrelated to the original finding. b1.ab opens with "&a1.*" before its header: E403 (5.1). Written in the 1.0 position the same clone would be E407, because a clone source must use the same template and cross-template clones do not exist in 1.0 (5.7); there is no --allow-unknown to smuggle the source's fields through (5.12), and an E409 note never lists "template" or "id" as declared fields (5.12).'''
