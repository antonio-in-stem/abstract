spec_note = '''Root tree: every "&lN.*" in chain.ab follows a body statement, so each is E404 (5.7: a clone must appear immediately after the header, before any assignment). chain.ab holds about 3000 such lines, so a default --max-errors run reports the first 20 E404 diagnostics and never reaches the separate E403 that leaf.ab's leading "&l3000.*" would raise (5.1); the file records the first identifier only. im-27: an assignment path of about 20000 segments exceeds the limit of 64, which is E209 (3.7), reported in P1 before the unknown-field check of P4.'''
