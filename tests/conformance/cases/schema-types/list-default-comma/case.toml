id = '''list-default-comma'''
area = '''schema-types'''
title = '''A comma-separated default on a list field produces a self-contradictory error: "received 'a, b', expected one of: a, b"'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''ux'''
source_repro = '''repro/schema-types/list-default-comma/'''
command = '''...\abstract.exe compile repro/schema-types/list-default-comma/data JSON'''
expected_kind = '''document'''
expected_note = '''Either list defaults support `[a, b]` / comma syntax, or a parse-time error at the schema line saying a list default must be a single value.'''
actual_0_2_0 = '''abstract: items/a.ab: Enum mismatch at Thing.tags: received 'a, b', expected one of: a, b.'''
spec_ref = '''4.10, 5.5, 8.4'''
status = '''ready'''
command_1_0 = '''compile data JSON'''
expected_1_0 = '''A default is written with the same value grammar instances use, including a bare comma-separated list, and = a, b is the same two-element list as = [a, b] (SPEC 4.10). The default is validated in P3 against enum(a, b) and filled in P4 step 4, so the instance that declares nothing emits the two-element list. The comma here is not a trailing comma, so E442 does not apply.'''
