expected_1_0 = '''An enum member is an identifier (SPEC 4.4.5, and enum_type in GRAMMAR.ebnf), so a quoted string in a member position is E210 at templates/Thing.abt:3. The star is not an identifier character, so an enum member can never end with one and a wildcard can never shadow a member (SPEC 5.6). The double expansion is unreachable in 1.0 for a second reason: interpretation is idempotent, so the re-validation of SPEC 7.3 step 7 cannot expand an already expanded value again.'''
