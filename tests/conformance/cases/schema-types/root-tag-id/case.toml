title = '''@tag on a root-level schema field consumes the instance's id and then DELETES `id` from the compiled output'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/schema-types/root-tag-id/'''
