title = '''A bare value that begins with '//' is E210 wherever the '//' stands, the ':' included'''
severity = '''minor'''
kind = '''spec-gap'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.2, 3.5, GRAMMAR bare_text'''
expected_note = '''SPEC 3.2 states two rules about '//' in a value, and only one of them is a consequence of the comment rule. 'An unquoted value MUST NOT contain " //"' follows from comment stripping; 'an unquoted value MUST NOT begin with "//"' is a rule in its own right and holds wherever the value begins, including immediately after the ':', where no comment rule fires. GRAMMAR.ebnf already carried it as a hard constraint on bare_text. `label://x` is therefore E210 at the '//', and the author writes `label: "//x"`, the spelling SPEC 3.2's own example uses. One spelling keeps one meaning: moving the value onto its own line, or leaving a space after the ':', no longer changes what the file means.'''
spec_note = '''The spaced form was always E210: `label: //x` is emptied by comment stripping, and a value emptied that way is E210 rather than an empty assignment (SPEC 3.2). The rule now reaches both forms through the same sentence.'''
actual_1_0 = '''exit 1; the '//' at the start of the value is E210 and names the remedy (quote the value).'''
