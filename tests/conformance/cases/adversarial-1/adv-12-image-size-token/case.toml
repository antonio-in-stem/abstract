id = '''ADV-12'''
area = '''adversarial-1'''
title = '''A malformed image size token is reported as E206 with a message that contradicts itself'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''4.4.7, 9.8, 10.2, 10.3'''
spec_note = '''SPEC 4.4.7: 'A size token is one lexeme with no internal whitespace (SPEC 3.1): WIDTHxHEIGHT, where each side is a decimal integer or * meaning any.' '-1x-1' is one lexeme in the size-token position and is not a WIDTHxHEIGHT, so it is E308, 'Invalid image size {text}; expected WIDTHxHEIGHT where each side is a number or *.' (SPEC 10.3). E206 is defined for 'A character that cannot appear in an identifier', and '-' is an identifier character (SPEC 3.3), so E206 cannot be the condition here. The message the implementation prints is self-refuting: it names '-' as invalid and then lists '-' among the valid characters, which SPEC 9.8's 'one sentence' requirement cannot be read to permit. 'image(png 128)' and 'image(png 1x2x3)' are E308 today, so only the sign case is misrouted.'''
actual_1_0 = '''exit 1, "data/templates/thing.abt:3:21: error[E206]: Invalid character '-' in identifier '-1x-1'; identifiers use A-Z a-z 0-9 _ -."'''
