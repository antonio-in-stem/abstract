id = '''ADV-19'''
area = '''adversarial-1'''
title = '''A trailing comma after an unbracketed tuple row is E210 naming the line terminator, not E442'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''2.2, 3.6, 5.5, 10.4'''
spec_note = '''SPEC 3.6: 'In particular a trailing , at value-bracket depth 0 does not continue a statement; it is E442.' SPEC 5.5 makes tuple rows depth-0 comma separated and allows a trailing comma only in the bracketed form ('a trailing comma inside brackets is allowed'), so this comma is a trailing comma at depth 0 and is E442, exactly as `tags: a,` and `caps: [#a],` already are. The message is wrong in a second way: SPEC 2.2 makes LF a line terminator, not a character of the program, so naming it 'control character U+000A' describes something the source does not contain.'''
actual_1_0 = '''exit 1 with `data/items/x.ab:3:40: error[E210]: Unexpected control character U+000A here; expected '('.` The bracketed spelling `copy(key, value): [(en_us, Welcome),]` is accepted, and `tags: a,` and `caps: [#a],` are correctly E442, so only the unbracketed tuple form takes this path.'''
