id = '''ADV-13'''
area = '''adversarial-1'''
title = '''The integer literal -0 assigned to a float field renders as -0.0, which is not structurally equal to 0.0'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''document'''
expected_files = '''expected.json'''
spec_ref = '''3.5, 4.4.3, 7.5, 8.7'''
spec_note = '''SPEC 3.5 defines a float literal as digits followed by '.' and digits, or an exponent, or both; '-0' has neither, so it is an integer literal, and the integer it denotes is zero - the same source on an int field emits 0. SPEC 4.4.3: 'A float field accepts an integer literal as well as a float literal (price: 19 yields 19.0)', so the value is the integer 0 widened to 0.0, and SPEC 8.7 renders '-0.0' only 'for negative zero'. The distinction is load-bearing rather than cosmetic: SPEC 7.5 says 'Two numbers are structurally equal when they render identically under 8.7, so 0.0 and -0.0 are not equal', so a version that writes '-0' and a version that writes '0' to the same field produce an overlay entry that the spec says should have been discarded. `ratio: -0.0` and `ratio: -0e0` are float literals for negative zero and correctly render '-0.0'.'''
actual_1_0 = '''exit 0, "ratio": -0.0. A schema default written `= -0` behaves the same way.'''
