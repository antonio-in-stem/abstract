id = '''ADV-14'''
area = '''adversarial-1'''
title = '''An unterminated `${` in an unquoted value is E203, not the E427 the catalogue gives as its own example'''
severity = '''major'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.1, 3.6, 5.11, 10.4'''
spec_note = '''SPEC 5.11: 'An unterminated ${ is E427.' SPEC 10.4 gives E427 the condition "Unterminated '${'", the message "Unterminated '${'." and the example `label: ${id` - which is this file, character for character. SPEC 3.1 settles why: '${' is one of the constructs that 'are single lexemes', so the '{' of a '${' is part of that lexeme and is neither the '{' of a multi-path key list nor a block brace, the only two kinds SPEC 3.6 puts on a stack. The lexer therefore has nothing to leave open at end of file, and the value reaches interpolation, which reports E427.'''
actual_1_0 = '''exit 1 with `data/items/x.ab:3:13: error[E203]: Unclosed '{' opened at 3:13.` The '{' of the '${' is pushed on the bracket stack, so E427 is unreachable from an unquoted value. The same text inside a quoted string (`label: "${id"`) does report E427, which is how the identifier stays reachable at all; only the catalogue's own spelling is misrouted.'''
