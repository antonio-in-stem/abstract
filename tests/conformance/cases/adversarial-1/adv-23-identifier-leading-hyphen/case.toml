title = '''An identifier that begins with '-' is E210 at the '-', never E206'''
severity = '''minor'''
kind = '''spec-gap'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.3, 10.2'''
expected_note = '''SPEC 3.3 states three rules for an identifier and now names a diagnostic for each: the character set is E206, 'MUST NOT end with -' is E207, and 'MUST begin with A-Z a-z 0-9 _' is E210 at the offending character. The third is a rule about where a character may stand, not about which characters exist, so E206 could never carry it: SPEC 3.3 lists '-' in the character set and E206's own message lists it among the characters an identifier may contain, which made the sentence the author read deny itself. E210's condition - a token or construct that is not valid here - is exactly the condition that holds. The rule is the same for every construct that takes an identifier: `-name: 1` in an instance path, `-name: text` in a schema and `@-name.x` in a header.'''
spec_note = '''The mirror rule is unchanged: `name-: 1` is E207, 'Identifier 'name-' must not end with '-'.'. D9 (the image size token `-1x-1`) reached the same contradiction through another construct and is settled by the same reading.'''
actual_1_0 = '''exit 1 with `data/items/x.ab:2:5: error[E210]: Unexpected '-' here; expected an identifier beginning with A-Z a-z 0-9 _.`'''
