id = '''ADV-17'''
area = '''adversarial-1'''
title = '''Whitespace between a field name and a tuple-array column list is accepted, although SPEC 3.1 names that '(' as a single lexeme'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''1.2 (P4), 3.1, 5.5, 10.2'''
spec_note = '''SPEC 3.1, Adjacency: 'The constructs below are single lexemes and MUST contain no internal whitespace: ... the ( that opens a parameterised type, a ref(, a $(, a #tag argument list, a tuple-array column list, or a @since( / @removed( annotation ... Whitespace inside any of these is E210, except before a parameterised type's (, which is E304.' A tuple-array column list is named in that list and is not the one exception, so `copy (key, value)` is E210. GRAMMAR.ebnf L9 repeats the same list.'''
actual_1_0 = '''exit 0; the space is discarded and the tuple array compiles. The sibling construct in the same sentence is enforced: `caps: [#a (txt: b)]` is E210, and so are `@since (1)` and `$ (Thing)`. A tab in the same position is accepted too.'''
