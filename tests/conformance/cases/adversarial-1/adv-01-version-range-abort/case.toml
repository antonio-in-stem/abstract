id = '''ADV-01'''
area = '''adversarial-1'''
title = '''A wide `versions` range aborts the process with an allocation failure instead of a diagnostic'''
severity = '''critical'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''undecided'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.7, 4.12, 7.4, 9.6, 11.1'''
expected_note = '''The normative requirement this case pins is SPEC 3.7: 'An implementation MUST NOT abort, panic or crash on any input. Every failure MUST be a diagnostic with an identifier and, where a source position is known, a position.' The identifier is a spec decision that has not been taken: SPEC 4.12 puts no upper bound on a version number and SPEC 7.4 requires every version in the range to be compiled, so a range no implementation can materialise is currently a legal program. The two candidate rulings are (a) a new SPEC 3.7 row 'Number of versions in the project range' with E209, or (b) an explicit cap in SPEC 4.12 reported as E602. This file pins E602 because the implementation already reports E602 for '1..4294967296', so capping lower is the smaller, self-consistent change; substitute E209 if the spec takes ruling (a).'''
spec_note = '''SPEC 3.7 forbids aborting on any input; SPEC 9.6 defines exit codes 0-3 only. The run terminates with the Windows abort status 3221226505 (0xC0000409) and the bare message 'memory allocation of 48000000000 bytes failed' on stderr - no identifier, no position, and an exit code outside the table of SPEC 9.6.'''
actual_1_0 = '''abstract compile . JSON -> exit 3221226505, stderr 'memory allocation of 48000000000 bytes failed'. Reproduces in the debug and the release profile, for compile in all three formats and for lint; only `templates` (P0-P3 only) survives. Root cause: versions.rs materialise() allocates vec![Vec::new(); project.count()]. Below the abort threshold the range is still unbounded work: 1..1000000 takes ~21 s and the cost is linear, so 1..100000000 is a hang.'''
