id = '''ADV-04'''
area = '''adversarial-1'''
title = '''A value at exactly the documented bracket nesting depth of 64 is rejected as E209 instead of E441'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.7, 4.6, 5.5, 10.4'''
spec_note = '''SPEC 3.7 sets the limit for 'Bracket nesting depth in any value' at 64 and requires E209 'when one is exceeded'. A value with 64 nested '[' has depth 64, which does not exceed 64, so the value is lexed and the applicable diagnostic is the one for its content: nested lists do not exist, which is E441 (SPEC 4.6, 5.5, 10.4). The same source with 63 brackets is E441 today and with 65 is E209, so only the boundary itself is wrong. SPEC 3.7's other counts are enforced correctly at the boundary: 64 path segments are accepted and 65 is E209, and 64 nested parentheses in a logic condition are accepted and 65 is E209.'''
actual_1_0 = '''exit 1, 'data/items/x.ab:3:75: error[E209]: Bracket nesting depth in a value exceeds the limit of 64.' The implementation has two bracket-depth checks that disagree by one: lexer.rs push_bracket rejects the 65th bracket (correct) while lexer.rs scan_single_value rejects an element at depth 64 (one too early), and the second is the one a list value reaches.'''
