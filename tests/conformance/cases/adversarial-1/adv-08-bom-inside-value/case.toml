id = '''ADV-08'''
area = '''adversarial-1'''
title = '''A byte-order mark inside a bare value is accepted and reaches the compiled document'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''2.2, 3.5, 8.8'''
spec_note = '''SPEC 2.2: 'A UTF-8 byte-order mark (EF BB BF) at offset 0 MUST be removed before lexing and has no other effect. A BOM anywhere else is an ordinary character and is E210 outside a quoted string.' The BOM here is at neither offset 0 nor inside a quoted_string: it is in the middle of a bare value, which is outside a quoted string, so it is E210. A BOM at the start of a statement line is E210 today, so the rule is applied outside values but not inside them.'''
actual_1_0 = '''exit 0; the compiled document carries "name": "a\ufeffb" with the BOM emitted literally as UTF-8 (SPEC 8.8 escapes only C0/C1 controls), so an invisible character survives into every consumer of the document.'''
