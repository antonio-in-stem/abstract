id = '''ADV-03'''
area = '''adversarial-1'''
title = '''A clone chain of 80 is accepted when the ids sort along the chain: the limit is enforced against resolver recursion, not chain length'''
severity = '''major'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.7, 5.7, 7.6'''
spec_note = '''SPEC 3.7 caps the 'Length of a clone chain (transitive clone depth)' at 64 and SPEC 5.7 repeats it: 'Chains deeper than 64 are E209.' This project is one chain of 80 instances - a79 clones a78 clones ... clones a00 - so its transitive clone depth is 80 and it must be E209. The property is structural: it cannot depend on how the ids are spelled, because SPEC 5.7 also requires resolution to be memoised, which is an optimisation and not a semantic.'''
actual_1_0 = '''exit 0, a valid document with 80 objects. The same 80-long chain written the other way round (a00 clones a01 clones ... clones a79, case adv-03b) is E209, because instances are resolved in (template, id) order and the check counts the resolver's recursion depth, which memoisation flattens to 1 when each clone source has already been resolved. Renaming the ids therefore changes the diagnostic.'''
