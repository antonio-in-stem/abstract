id = '''ADV-18'''
area = '''adversarial-1'''
title = '''A bare flag argument of a #tag object on a non-bool field is silently coerced to the text 'true''''
severity = '''major'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''1.2 (P4), 1.3, 5.5, 10.4'''
spec_note = '''SPEC 5.5, tagged objects: 'A bare flag argument sets the field flag to true and is valid only when flag is a bool field (E412).' `label` is declared text, so `#search(label)` is E412. SPEC 1.2 P4 forbids a silent coercion and SPEC 1.3 guarantee 4 says every emitted value has the type its schema declares - which a boolean flag turned into the string "true" does not.'''
actual_1_0 = '''exit 0, and the object emits "label": "true". The flag is not checked against the field's declared type at all: it is turned into the bare value `true` and then interpreted by the field's type, so a text field silently takes the string "true" (including the @tag field itself, which then keys the element under "true"), an enum field is E414 ('true' is not one of ...) rather than E412, and int and float fields are E412 by accident of the shape check, with the message 'expected int, found text'.'''
