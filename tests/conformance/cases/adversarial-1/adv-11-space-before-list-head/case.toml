id = '''ADV-11'''
area = '''adversarial-1'''
title = '''Whitespace between a field name and its list head is silently accepted'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''1.2 (P4), 3.1, 4.3'''
spec_note = '''SPEC 4.3: '[] immediately after the name marks a list field'. SPEC 3.1 lists '[] and [<cardinality>] in a field head' among the constructs that are single lexemes, and says 'Whitespace inside any of these is E210, except before a parameterised type's (, which is E304' - the one exception is spelled out, and a field head is not it. `tags [1..2]` therefore has no list head; the token after the field name is '[' where ':' was expected, which is E210. P4 forbids a silently ignored token. The implementation already rejects `tags[1 ..2]` with E210, so the same lexeme is held to the adjacency rule in one direction and not the other.'''
actual_1_0 = '''exit 0; the space is discarded and the field compiles as the list field `tags[1..2]`, so `tags: [a, b]` is accepted and emitted as a two-element array.'''
