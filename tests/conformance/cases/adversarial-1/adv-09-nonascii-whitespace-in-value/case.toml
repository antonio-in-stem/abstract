id = '''ADV-09'''
area = '''adversarial-1'''
title = '''Non-ASCII whitespace is ordinary text inside a bare value; a control character in the same position is E210'''
severity = '''minor'''
kind = '''spec-gap'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.1, 3.5, 8.8'''
expected_note = '''SPEC 3.5 now fixes the character set of bare text once, for every construct: a bare_text run admits every Unicode scalar value except a C0 control, U+007F and a C1 control. SPEC 3.1's "no other whitespace character" is a rule about what may stand BETWEEN tokens; inside a token the token's own rule governs. Of the three instances in this project, `nbsp` (U+00A0) and `ls` (U+2028) are therefore ordinary text and compile, and `nel` (U+0085) is a C1 control and is E210 at the character. The project fails with exactly one diagnostic, E210, which is what this file pins. The same set is escaped on output (SPEC 8.8), so a control character never reaches a consumer unescaped whichever spelling produced it, while U+00A0 and U+2028 are emitted literally.'''
spec_note = '''The reading matters for authored text: U+00A0 in a caption is plausible, and it now means the same thing wherever it stands. The inconsistency the case recorded is gone with it - U+000B and U+000C refused while U+0085 was accepted, and U+00A0 refused outside a value but accepted inside one. A control character an author really needs goes inside a quoted string, which admits every scalar value except a line terminator.'''
actual_1_0 = '''exit 1 with one diagnostic: the U+0085 in the `nel` instance is E210, named as a control character. The `nbsp` and `ls` instances raise nothing.'''
