spec_note = '''SPEC 3.7 sets 'Nesting depth of if / for blocks in one logic block' at 64 and requires E209 only when the limit is exceeded. 64 nested `if` blocks are at the limit. The outermost condition is false because '.flag' is absent (SPEC 6.8), so no body runs and the project compiles. 63 nested blocks compile today; 64 do not.'''
actual_1_0 = '''exit 1, 'error[E209]: Nesting depth of if / for blocks in one logic block exceeds the limit of 64.' logic.rs uses `depth >= LOGIC_BLOCK_DEPTH`.'''
expect = '''ok'''
