id = '''ADV-20'''
area = '''adversarial-1'''
title = '''Trailing text after a closed quoted value is reported at the wrong position when the trailing text contains a quote'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''5.5, 7.1, 11.1'''
spec_note = '''SPEC 5.5: 'a leading " always starts a quoted string, whose closing quote MUST end the value - trailing text after it is E210.' The value closes at column 17 and the trailing text starts at column 19, so E210 belongs at column 19. SPEC 7.1 makes lexing and parsing one phase (P1), so SPEC 11.1's tie-break (3) applies: within a phase the earliest source position wins, and column 19 precedes the column 20 at which the second quote opens. The same line without the trailing quote (`name: "Atlas" b`) is correctly E210 at column 19, so the position is only lost when the trailing text happens to contain a quote.'''
actual_1_0 = '''exit 1 with `data/items/x.ab:2:20: error[E201]: Unterminated string literal; strings must open and close on the same line.` and no E210 at all. Lengthening the trailing text moves the E201 further right (`name: "Atlas" bb cc"` is E201 at column 24), which shows the diagnostic follows the stray quote rather than the first offending token.'''
