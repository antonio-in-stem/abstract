id = '''ADV-02'''
area = '''adversarial-1'''
title = '''62 nested parentheses in a logic condition overflow the stack in the default (debug) build'''
severity = '''major'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.7, 6.6, 11.1'''
spec_note = '''SPEC 3.7 caps bracket nesting in a value at 64 and states that the limits 'exist so that a hostile or corrupted source can never exhaust the stack', and that an implementation 'MUST NOT abort, panic or crash on any input'. 62 nested parentheses is inside that cap - the same source with 64 parentheses is accepted by the release binary and 65 is E209 - so the condition must be evaluated. '.flag' is absent, so the comparison is false (SPEC 6.8) and the require fails: E515 with the author's message.'''
actual_1_0 = '''target/debug/abstract.exe compile . JSON -> exit 3221225725 (0xC00000FD, STATUS_STACK_OVERFLOW), stderr 'thread 'main' has overflowed its stack', no diagnostic. The release binary reports E515 correctly. The debug threshold is 59 nested parentheses (58 is fine), i.e. below the documented limit of 64. The conformance runner and `cargo test` both execute CARGO_BIN_EXE_abstract, which is the debug binary, so the crash is what the suite sees.'''
