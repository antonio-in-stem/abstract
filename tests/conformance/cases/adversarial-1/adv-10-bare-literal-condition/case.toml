id = '''ADV-10'''
area = '''adversarial-1'''
title = '''A bare boolean literal is accepted as a logic condition, where SPEC 6.6 makes every bare literal E513'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''6.6, 10.5'''
spec_note = '''SPEC 6.6: 'A condition MUST evaluate to a boolean. A bare path is a valid condition only when it names a bool field; anything else (a bare text field, a bare length(...), a bare literal) is E513. Abstract has no truthiness.' `true` is a boolean literal (SPEC 3.5), so `require true` is a bare literal used as a condition and is E513. The other four spellings of a bare operand - `require 1`, `require "a"`, `require version`, `require length(.name)` and `require .name` on a text field - are all E513 today, so only the boolean literal escapes the check.'''
actual_1_0 = '''exit 0. `require false else throw "m"` is likewise accepted and fails with E515 rather than E513, and `require not true` is accepted too.'''
