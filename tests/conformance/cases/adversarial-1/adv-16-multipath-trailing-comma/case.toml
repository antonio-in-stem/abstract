id = '''ADV-16'''
area = '''adversarial-1'''
title = '''A trailing ',' in a multi-path key list is silently discarded'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''1.2 (P4), 5.4, 5.5, 10.2'''
spec_note = '''GRAMMAR.ebnf: `multi_path_assignment = path , "." , "{" , identifier , { "," , identifier } , "}" , ":" , value` - no trailing separator, and the one place the grammar does allow one is written out explicitly (`tuple_array_assignment` ends `{ "," , tuple_row } , [ "," ] , "]"`). SPEC 5.4 says 'Keys are single identifiers'; the token after the last ',' is '}', which is not an identifier, so it is E210. SPEC 5.5's 'a trailing comma is allowed inside brackets' is about list values, not about a key list. SPEC 1.2 P4 forbids a silently ignored token.'''
actual_1_0 = '''exit 0; the value is assigned to both keys as if the comma were not there. A leading comma in the same list (`owner.{, team}`) is correctly E210 with 'expected a key name', and a doubled comma (`owner.{team,, contact}`) is E210 too, so only the trailing position escapes the check.'''
