id = '''ADV-22'''
area = '''adversarial-1'''
title = '''A body block written on one line reports E203 and E205, whose conditions did not occur, instead of the E210 every sibling spelling reports'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.6, 5.4, 10.2'''
spec_note = '''SPEC 3.6: 'A block's { MUST be the last token of its logical line and its } MUST be the first token of a logical line', repeated in SPEC 5.4 for body blocks. The first token after the '{' that is not on a new line is `team`, so the violation is E210 there - which is what the implementation reports for every neighbouring spelling: `owner { team: T` with the '}' on the next line, `owner { }`, `owner { x`, `owner{team, contact}: T` and a '}' followed by text are all E210 'expected end of line'. E203's condition is 'End of file with brackets still open' and E205's is 'A closing bracket with nothing open'; neither happened here, because the '}' on this line does have an open block brace - the one at column 11 that E203 simultaneously claims was never closed.'''
actual_1_0 = '''exit 1 with two diagnostics: `3:11: error[E203]: Unclosed '{' opened at 3:11.` and `3:29: error[E205]: Unexpected '}'.` The E203/E205 pair appears only when a complete `key: value` statement sits between the braces on one line; adding a second statement keeps it, and removing the value or the closing brace switches to E210.'''
