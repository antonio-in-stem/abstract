id = '''ADV-07'''
area = '''adversarial-1'''
title = '''A ']' closing a '(' is not reported as a bracket-type mismatch (E204)'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''3.6, 10.2, GRAMMAR.ebnf bare_text'''
spec_note = '''SPEC 3.6: 'The lexer maintains a value-bracket stack for ( ), for [ ], and for the { } of a multi-path key list. Types MUST match: a ) closing a [ is E204'. GRAMMAR.ebnf repeats it for bare_text: 'Brackets inside a bare_text MUST be balanced and correctly typed.' The mirror image of the spec's own example - a ']' arriving while a '(' is open - is the same condition and must be E204, whose template names both brackets. E205 is defined for 'A closing bracket with nothing open', which is not the case here. The sibling spelling 'tags: [core)' is E204 today, so only the ( ) direction is wrong.'''
actual_1_0 = '''exit 1, two diagnostics: 'data/items/x.ab:3:22: error[E210]: Unexpected ']' here; expected ',' or ')'.' then 'data/items/x.ab:3:22: error[E205]: Unexpected ']'.' Neither names the '(' the ']' failed to close.'''
