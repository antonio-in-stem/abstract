id = '''ADV-15'''
area = '''adversarial-1'''
title = '''A leading ',' in an instance header tag list is silently discarded'''
severity = '''minor'''
kind = '''bug'''
verdict = '''confirmed'''
status = '''ready'''
expected_kind = '''error'''
expected_files = '''expected-error.txt'''
spec_ref = '''1.2 (P4), 5.2, 10.2'''
spec_note = '''GRAMMAR.ebnf: `header_tag_list = header_tag , { "," , header_tag }` - the list starts with a tag, never with a separator. SPEC 5.2 gives the ',' exactly one job ('The header tag list is the one construct that continues across physical lines on a trailing ,') and SPEC 1.2 P4 forbids 'a silently ignored token'. The token after '::' is ',' where a header tag, '@since(' or the end of the line was expected, which is E210 - the identifier the implementation already produces for `Thing ::: @id.x` and for `Thing :: @id.x @since (1)`.'''
actual_1_0 = '''exit 0; the comma is discarded and the instance compiles as if it were not there. Exactly one leading comma is swallowed: `Thing :: ,, @id.x` is E442 and `Thing :: ,` alone is E442, so the parser does look at the second one.'''
