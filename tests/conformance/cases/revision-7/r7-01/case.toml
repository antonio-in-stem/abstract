expected_note = '''SPEC 3.7 bounds the loop iterations the logic of one instance may execute for one version at 1000000, counting one unit for each execution of a `for` body. These seven blocks demand 11111110 iterations. The compile stops at the 1000001st and reports E523 at the `for` whose iteration crossed the bound - the second one, because one of its iterations costs 111111 and its tenth crosses 1000000. Nothing before revision 7 bounded the work a legal program could demand: the nesting is seven levels deep, well inside every other row of SPEC 3.7.'''
