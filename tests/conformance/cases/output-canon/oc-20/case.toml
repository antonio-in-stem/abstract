note_1_0 = '''A tuple array MUST declare at least one column and every row MUST contain at least one cell, so 'caps(): ()' is E416 with note: a tuple array declares at least one column (SPEC 5.5). The array containing one empty object is unreachable, and so is the YAML null element of OC-07.'''
