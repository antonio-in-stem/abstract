command = '''caps[] @optional { name: text(1..80) @optional }
T :: @id.a
caps(): ()'''
expected_kind = '''error'''
expected_note = '''data/items/a.ab:2: tuple array 'caps' declares no columns (exit 1).'''
actual_0_2_0 = '''exit 0, JSON: "caps": [ {} ]  and RAW: caps: [{}]  (and YAML: caps:\n        -  i.e. a null element, see OC-07).'''
