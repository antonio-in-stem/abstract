note_1_0 = '''JSON puts every member of a non-empty array on its own line (SPEC 8.4), so the inline 'tags' of the 0.2.0 documentation was wrong, not the emitter. The write condition is now single: '--out <file>' writes the document and suppresses stdout (SPEC 9.4), the trailing 'true' write flag is gone (Appendix A, A58) and no extension is appended or checked. In the sibling project oc14-outpath/, 'compile . RAW true' is E805: with another positional present, a last positional that is neither a format keyword nor a valid input path is rejected (SPEC 9.2).'''
