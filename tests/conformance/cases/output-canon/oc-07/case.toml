title = '''YAML renders an empty object inside an array as `- ` (null), diverging from JSON's `{}`'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/output-canon/oc12-empty-object/'''
command = '''caps[] @optional { name: text @optional }
caps(): ()'''
