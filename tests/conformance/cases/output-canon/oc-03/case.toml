note_1_0 = '''Both statements are E443. In data/items/alpha.ab, 'owner.team' traverses a value that is not an object; in data/items2/beta.ab, 'label.sub' traverses the scalar field 'label'. E443 is reported in preference to the E412 that 'owner: plain text' would also raise on a $(Schema) field (SPEC 11.1 fixes the pair E443 before E412). Instances are visited in (template, id) order (SPEC 2.7, 7.3), so the T2/beta diagnostic precedes the Thing/alpha one; both ids are E443, so the file is order-independent. The four sibling projects resolve as follows: case-b ('label:' then 'label.sub:') is E443; case-c (the same two statements in the reverse order) is also E443, because a non-final path segment naming a field the schema declares as a scalar can never be traversed and SPEC 1.2 P4 forbids silently dropping the statement; case-d is E409 for the unknown field 'regionn' with the suggestion 'region' (SPEC 9.8); case-e ('label.sub.deep') is E443.'''
