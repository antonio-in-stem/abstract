id = '''LP-005'''
area = '''lexing-parsing'''
title = '''Panic (process abort) parsing a `#tag` value whose `(` comes after its last `)`'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/lexing-parsing/bug-01-panic-tag-parens/'''
command = '''`cd repro/lexing-parsing/bug-01-panic-tag-parens && abstract compile . JSON`'''
expected_kind = '''error'''
expected_note = '''A CompileError like `data/things/x.ab:2: malformed tag object '#tag)x(' (expected '#name' or '#name(args)')`, exit code 1.'''
actual_0_2_0 = '''source: `Thing :: @id.x` / `    note: #tag)x(`
```
thread 'main' (43648) panicked at src\lib.rs:1921:35:
begin > end (6 > 3) when slicing `tag)x(`
note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace
```
exit code 101.'''
spec_ref = '''3.1, 3.6, 5.5, 10.2 (E205)'''
status = '''ready'''
spec_note = '''A leading "#" always starts a tag object (5.5) and the argument list "(" must be adjacent (3.1), so the tag object is exactly "#tag". The following ")" is a closing bracket with an empty value-bracket stack, which 3.6 makes E205. The lexical error is in P1 and therefore precedes the E412 that the text-typed target would otherwise raise in P4 (7.1, 11.1).'''
