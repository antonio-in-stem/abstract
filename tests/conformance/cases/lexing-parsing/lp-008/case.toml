id = '''LP-008'''
area = '''lexing-parsing'''
title = '''Stack overflow (unrecoverable abort) on deeply nested `#tag(...)` values or long dotted paths'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''security'''
source_repro = '''repro/lexing-parsing/bug-17-deep-tag-recursion/ (also references: repro/lexing-parsing/bug-18-deep-dotted-path/)'''
command = '''`cd repro/lexing-parsing/bug-17-deep-tag-recursion && abstract compile . JSON` and the same in bug-18-deep-dotted-path. Measured thresholds: tag nesting aborts between n=1000 (exit 1) and n=3000 (exit 127); dotted path aborts between n=3000 (exit 1) and n=6000 (exit 127).'''
expected_kind = '''error'''
expected_note = '''A CompileError such as "value nesting too deep (max 64)" / "assignment path too deep", exit code 1, with a file and line number.'''
actual_0_2_0 = '''```
$ abstract.exe compile . JSON

thread 'main' (39164) has overflowed its stack
$ echo $?
127
```
Identical result for bug-18-deep-dotted-path (`thread 'main' (42744) has overflowed its stack`, exit 127).'''
spec_ref = '''3.7, 10.2 (E209)'''
status = '''ready'''
expected_files = '''expected-error.txt (root tree); bug-18-deep-dotted-path/expected-error.txt'''
spec_note = '''3.7 fixes both limits at 64 and requires E209 naming the subject and the limit: the root tree nests 5000 "#t(...)" argument lists (bracket nesting depth in a value) and bug-18-deep-dotted-path writes an assignment path of about 10000 segments (segments in an assignment path). 3.7 also forbids aborting or panicking on any input.'''
