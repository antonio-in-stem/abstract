id = '''LP-010'''
area = '''lexing-parsing'''
title = '''Assigning `id` in the body desynchronizes the registry id from the emitted id, producing duplicate ids in the output'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/lexing-parsing/bug-33-id-override-dup/'''
command = '''`cd repro/lexing-parsing/bug-33-id-override-dup && abstract compile . JSON`'''
expected_kind = '''undecided'''
expected_note = '''`Duplicate instance id 'b'` (or a rejection of the second `id` assignment). The compiled output must never contain two objects with the same id.'''
actual_0_2_0 = '''a.ab = `Thing :: @id.a` / `    id: b` / `    name: FromA`; b.ab = `Thing :: @id.b` / `    name: FromB`.
output:
```
{ "data": [
  { "template": "Thing", "id": "b", "name": "FromA" },
  { "template": "Thing", "id": "b", "name": "FromB" }
] }
```
Exit 0.'''
spec_ref = '''4.11, 5.3, 5.4, 10.4 (E410)'''
status = '''ready'''
spec_note = '''The id is fixed by the header or the file stem and by nothing else (5.3), so "id: b" is E410. The registry id and the emitted id can therefore never diverge, and the duplicate this input produced in 0.2.0 is unreachable.'''
