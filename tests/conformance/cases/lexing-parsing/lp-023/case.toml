id = '''LP-023'''
area = '''lexing-parsing'''
title = '''A header tag value beginning with `./` silently loses its leading dot'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''ux'''
source_repro = '''repro/lexing-parsing/bug-14-header-dot-eaten/'''
command = '''`cd repro/lexing-parsing/bug-14-header-dot-eaten && abstract compile . JSON`'''
expected_kind = '''error'''
expected_note = '''`@icon./assets/logo.png` yields `icon: "./assets/logo.png"`, or a diagnostic explaining the separator ambiguity.'''
actual_0_2_0 = '''source: `Thing :: @id.x, @icon./assets/logo.png`
output: `"icon": "/assets/logo.png"`. Exit 0.'''
spec_ref = '''5.2, 5.10, 8.3'''
status = '''ready'''
spec_note = '''5.2 fixes this exactly: the tag name ends at the first "." after the identifier run and everything after that "." is the value verbatim, so "@icon./assets/logo.png" assigns "/assets/logo.png". Here "icon" is a text field, so the value is kept as written; on a file/image field the same value would be E424 (5.9), which is the example 5.2 gives.'''
