id = '''LP-028'''
area = '''lexing-parsing'''
title = '''A schema name containing a hyphen is accepted by the schema parser but can never be instantiated, and the error blames the wrong thing'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/lexing-parsing/bug-34-bad-template-name-msg/'''
command = '''`cd repro/lexing-parsing/bug-34-bad-template-name-msg && abstract compile . JSON`, then `... abstract.exe templates .`'''
expected_kind = '''undecided'''
expected_note = '''The .abt parser rejects `schema My-Thing` with "schema names must match [A-Za-z][A-Za-z0-9_]*", pointing at the schema file and line.'''
actual_0_2_0 = '''`abstract.exe templates .` -> `My-Thing` (schema registered fine).
`abstract.exe compile . JSON` -> `abstract: data/things/x.ab:1: statement 'My-Thing :: @id.x' appears before any instance header (expected 'Template :: ...' first)`. `abstract lint .` prints the same. Exit 1.'''
spec_ref = '''3.4, 4.2, 10.2 (E208)'''
status = '''ready'''
spec_note = '''A schema_name starts with a letter and continues with letters, digits and "_" only (3.4), so "My-Thing" is E208 at its declaration - the declaration is blamed, not the instance. data/templates/thing.abt sorts before data/things/x.ab (2.4), so the schema diagnostic is the first one; the header in x.ab is malformed too and a multi-diagnostic run may add a second diagnostic there.'''
