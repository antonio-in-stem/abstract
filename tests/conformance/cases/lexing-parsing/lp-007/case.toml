spec_note = '''"}" is not an identifier character (3.3), so the left side lexes as the identifier "a" followed by a "}" token with no open block brace: E205 (3.6). A multi-path key list is written "prefix.{a, b}" with the "{" after the "." and the "}" after it (5.4); the reversed spelling can never be one.'''
