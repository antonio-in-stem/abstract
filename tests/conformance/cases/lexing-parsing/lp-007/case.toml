expected_kind = '''undecided'''
expected_note = '''`CompileError::at(path, line, "invalid multi path 'a}.{b' (missing '}')")` — the error this function already emits for the other malformed shapes — exit code 1.'''
actual_0_2_0 = '''source: `Thing :: @id.x` / `    a}.{b: v`
```
thread 'main' (45212) panicked at src\lib.rs:1782:50:
