id = '''LP-026'''
area = '''lexing-parsing'''
title = '''`\n`, `\t` and `\r` inside quoted Windows paths are silently turned into control characters while every other escape passes through'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''ux'''
source_repro = '''repro/lexing-parsing/bug-13-escape-windows-path/'''
command = '''`cd repro/lexing-parsing/bug-13-escape-windows-path && abstract compile . JSON` (inspect with `| od -c`)'''
expected_kind = '''error'''
expected_note = '''Either an unknown escape is an error (making the escape set explicit and teaching the author to write `\\`), or a warning when a decoded string gains a control character. Silent half-transformation is the worst option.'''
actual_0_2_0 = '''source: `note: "C:\new\table\report.txt"`
JSON output bytes (od -c): `"   C   :   \   n   e   w   \   t   a   b   l   e   \   r   e   p   o   r   t   .   t   x   t   "` — i.e. the emitted JSON encodes a newline, a tab and a carriage return, so a consumer reads `C:<LF>ew<TAB>able<CR>eport.txt`. Exit 0.'''
spec_ref = '''3.5, 8.8'''
status = '''ready'''
spec_note = '''3.5 defines exactly five escapes, so "\n", "\t" and "\r" in this value produce U+000A, U+0009 and U+000D and the document escapes them again under 8.8 - the JSON spelling is byte-identical to the source spelling. 3.5 is explicit that Windows paths MUST be written with "/" or with "\\"; an escape outside the five is E202, which this input does not contain.'''
