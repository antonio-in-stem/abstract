spec_note = '''Both trees are valid programs and the case is a complexity bound, not an output contract: 5.11 requires the variable table to be built once per instance and per version and each string to be rewritten in one left-to-right pass, so the cost is linear in the total length of the text values plus the size of the table. The compiled documents (one instance with 200 scalar fields and 60000 tag elements, and one with 60 fields and 20000 elements) are not transcribed here; "ok" means exit 0 with a well-formed document, which is the checkable part of the requirement.'''
