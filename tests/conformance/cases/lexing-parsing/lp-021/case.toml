id = '''LP-021'''
area = '''lexing-parsing'''
title = '''A literal U+0001 in a value is silently rewritten to `$` by the `$$` escape sentinel'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/lexing-parsing/bug-29-sentinel-u0001/'''
command = '''`cd repro/lexing-parsing/bug-29-sentinel-u0001 && abstract compile . JSON`'''
expected_kind = '''document'''
expected_note = '''The U+0001 character is preserved (or rejected as an unsupported control character); it must not become `$`.'''
actual_0_2_0 = '''source value: `"cost \x01 5 dollars $name"` with `name: A`.
output (od -c of the note line): `"   n   o   t   e   "   :       "   c   o   s   t       $       5       d   o   l   l   a   r   s       A   "` — the U+0001 became `$`.'''
spec_ref = '''3.5, 5.11, 8.8'''
status = '''ready'''
spec_note = '''U+0001 is an ordinary string_char (3.5, GRAMMAR string_char) and survives to the output, where 8.8 escapes it as \u0001 in lowercase hexadecimal. There is no "$$" sentinel pass: 5.11 forbids implementing interpolation by round-tripping through an in-band sentinel character. "$name" resolves to the root scalar field "name".'''
