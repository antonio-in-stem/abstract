id = '''L14'''
area = '''language-design'''
title = '''Quoting rules are value-dependent and surprising: a comma makes prose into a list, and a two-part version number like `1.3` is a float, not text'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/language-design/case8/ (also references: repro/language-design/case14/)'''
command = '''# comma in prose:
cat repro/language-design/case8/data/objects/q1.ab   # desc: Hello, world
./project/target/release/abstract.exe compile repro/language-design/case8/data JSON
OUTPUT: abstract: objects/q1.ab: Type mismatch at Q.desc: expected text, but received a list value. Wrap the value in quotes to keep it as text.
# version numbers:
cat repro/language-design/case14/data/objects/m.ab
#   version_support: 3.0, 3.1        (schema: version_support[]: text(1..20))
#   project_version: 1.3
#   semver: 1.21.5
./project/target/release/abstract.exe compile repro/language-design/case14/data JSON
OUTPUT: abstract: objects/m.ab: Type mismatch at M.version_support: expected text, but received a float value. Wrap the value in quotes to keep it as text.
(1.21.5 would have been fine — only the two-part forms break)'''
expected_kind = '''undecided'''
expected_note = '''When the schema says `text`, a scalar literal should be taken as text without requiring the author to know the float grammar; and prose fields should not need defensive quoting.'''
actual_0_2_0 = '''`1.3` and `3.0` are floats and rejected by text fields while `1.21.5` is accepted; an unquoted comma silently changes a scalar into a list.'''
spec_ref = '''3.5, 5.5, 5.10, 10.4 (E412), A.1 (A69)'''
status = '''ready'''
expectation_1_0 = '''
compile data JSON (cwd = case root)     -> expected-error.txt
compile data JSON (cwd = l14/case14)    -> case14/expected.json
case14 answers the version-number half outright: the parser infers no type, so "3.0", "1.3"
and "1.21.5" on text fields are the lexemes verbatim and the tree compiles (5.10). The comma
half is decided the other way and made uniform: a "," at value-bracket depth 0 always
separates list items, whatever the declared type (5.5, A.1 A69), so prose with a comma is
quoted. In the primary tree q1 compiles but q2 fails: an unquoted value never begins with "#",
so "desc: #search" is a tag object on a text field and is E412 with the note that names the
leading "#".
'''
