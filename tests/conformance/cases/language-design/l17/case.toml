id = '''L17'''
area = '''language-design'''
title = '''The documented direct-compile form `abstract object.ab Template.abt JSON` fails with a self-contradictory duplicate-schema error whenever the template sits under the object's own directory — the layout the docs recommend'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/language-design/case13b/ (also references: repro/language-design/case13/)'''
command = '''# case13b: data/top.ab  +  data/templates/D.abt   (template is inside the .ab's own tree)
./project/target/release/abstract.exe repro/language-design/case13b/data/top.ab repro/language-design/case13b/data/templates/D.abt JSON
OUTPUT (exit 1): abstract: templates/D.abt: Duplicate schema 'D'. It is already defined in 'D.abt'; schema names must be unique across the project.
Same failure on the real corpus (read-only):
cd "<private corpus>"
.../abstract.exe example/pack.ab abstract-data/templates/Meta.abt JSON --skip-assets
OUTPUT: abstract: data/templates/Option.abt: Duplicate schema 'Option'. It is already defined in 'Option.abt'; ...
(It happens to work when the .ab is in a subdirectory that does not contain the templates: case13 with data/objects/d1.ab + data/templates/D.abt compiles fine — so the failure is layout-dependent and looks random to a user.)'''
expected_kind = '''undecided'''
expected_note = '''Naming a template explicitly should never conflict with finding the same template by directory walk.'''
actual_0_2_0 = '''The same file loaded under two roots is treated as two schemas; the error names one file as its own duplicate; the documented CLI form fails on the recommended project layout.'''
spec_ref = '''2.3, 2.4, 2.5, 9.2, 10.3 (E301), A.3 (A53)'''
status = '''ready'''
