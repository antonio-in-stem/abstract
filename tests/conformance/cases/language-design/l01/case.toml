id = '''L01'''
area = '''language-design'''
title = '''A typo in a `logic <Name>` block silently disables every rule in it (exit 0, no diagnostic)'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/language-design/case21/'''
command = '''cat repro/language-design/case21/data/objects/g.ab  # Guard :: @id.g, @status.active   (no contact)
./project/target/release/abstract.exe compile repro/language-design/case21/data JSON
OUTPUT (exit 0):
{
"data": [
{ "template": "Guard", "id": "g", "status": "active" }
]
}
Then: sed -i 's/logic Gaurd/logic Guard/' repro/language-design/case21/data/templates/G.abt
./project/target/release/abstract.exe compile repro/language-design/case21/data JSON
OUTPUT (exit 1): abstract: objects/g.ab: Guard logic: Active guards need a contact.'''
expected_kind = '''error'''
expected_note = '''`logic Gaurd { ... }` should be a hard compile error: "Unknown schema 'Gaurd' in logic block at templates/G.abt:6. Did you mean 'Guard'? Declared schemas: Guard." A logic block that binds to nothing is always an authoring mistake.'''
actual_0_2_0 = '''The block is stored under the key "Gaurd", never looked up, never reported. The instance compiles and the `require` never runs. Exit code 0.'''
spec_ref = '''6.1, 6.12, 7.2 (P3), 10.5 (E501, E515)'''
