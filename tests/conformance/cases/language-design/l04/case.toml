title = '''`&clone` lines bind forward to the *next* instance header and are silently discarded when there is none'''
severity = '''major'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/language-design/case4/'''
command = '''&base.*'''
expected_kind = '''undecided'''
expected_note = '''Either (a) error on any `&clone` that is not immediately followed by an instance header, and error on leftover pending clones at EOF; or (b) better, move the clone into the header where it cannot float: `Thing :: &base, @id.after, @status.draft`, with `&base.stats` for partial clones.'''
actual_0_2_0 = '''Misplaced clones are silently ignored (exit 0) or silently retargeted to the following instance. No diagnostic exists for either case.'''
