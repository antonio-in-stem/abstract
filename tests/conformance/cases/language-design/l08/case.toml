expectation_1_0 = '''
compile data JSON (cwd = case root)      -> expected-error.txt
compile data JSON (cwd = l08/case10)     -> case10/expected.json
Kept as a rejection case for an unrelated reason: schema Pack declares the group "slots"
without @optional, so it is a required field, and braced.ab writes nothing at or under it. An
absent required group is E411 (4.7, 4.10). The construct the case is about works in 1.0: body
blocks are sugar for a dotted prefix (5.4, A.4), so braced.ab and dotted.ab are two spellings
of one object, and case10 shows a nested list group reached from instance syntax - "caps: #a,
#b" fills the @tag field of each element and the optional inner list group stays absent (5.5,
8.9). A positive case for body blocks needs "slots" marked @optional or assigned.
'''
