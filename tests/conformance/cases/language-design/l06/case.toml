compile data JSON (cwd = case root)      -> expected-error.txt   (two diagnostics)
compile data JSON (cwd = l06/case18b)    -> case18b/expected-error.txt (three diagnostics)
--allow-unknown is removed and there is no lenient mode (5.12, A.3 A52), so a retired field
