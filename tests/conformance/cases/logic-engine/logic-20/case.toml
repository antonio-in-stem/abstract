id = '''LOGIC-20'''
area = '''logic-engine'''
title = '''The ' else throw ' split is not quote-aware, so a condition containing that phrase in a string misparses into a wrong condition and a garbage message'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''bug'''
source_repro = '''repro/logic-engine/L21-else-throw-split-in-string/'''
command = '''repro/logic-engine/L21-else-throw-split-in-string — cd repro/logic-engine/L21-else-throw-split-in-string && abstract compile data JSON'''
expected_kind = '''undecided'''
expected_note = '''msg equals "run else throw now" exactly, so `require .msg == "run else throw now" else throw "msg must be the phrase"` should PASS.'''
actual_0_2_0 = '''abstract: items/one.ab: T logic: now" else throw "msg must be the phrase"
EXIT=1'''
spec_ref = '''3.5, 3.6, 6.3, 8.4'''
status = '''ready'''
note_1_0 = '''A quoted_string is lexed as one token, and the characters inside it are never keywords or separators (SPEC 3.5), so the 'else throw' inside the compared literal cannot split the statement. The condition is true and the instance compiles.'''
