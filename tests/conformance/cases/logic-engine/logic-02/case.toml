note_1_0 = '''Schema names are compared exactly (SPEC 3.4), so 'logic thing' does not bind to 'schema Thing'. All three blocks name an undeclared schema and each is E501, reported in source order (thing, Thnig, Widget); 'Thnig' and 'thing' carry the suggestion 'Thing' under SPEC 9.8. Because P3 stops at E501 for a block, the 'require false' inside 'logic Widget' is never reached and no E513 is reported.'''
