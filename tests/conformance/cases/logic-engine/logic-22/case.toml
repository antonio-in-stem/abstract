id = '''LOGIC-22'''
area = '''logic-engine'''
title = '''length() counts elements, so on any scalar it is always 1 — length-based guards on text silently always fail'''
severity = '''minor'''
verdict = '''confirmed'''
kind = '''design-flaw'''
source_repro = '''repro/logic-engine/L18-length-on-scalar-is-one/'''
command = '''repro/logic-engine/L18-length-on-scalar-is-one — cd repro/logic-engine/L18-length-on-scalar-is-one && abstract compile data JSON'''
expected_kind = '''error'''
expected_note = '''name is "a-very-long-product-name" (24 characters), so `require length(.name) >= 4` should pass — or length() on a scalar should be a compile error.'''
actual_0_2_0 = '''abstract: items/long.ab: T logic: name 'a-very-long-product-name' is too short
EXIT=1'''
spec_ref = '''6.6, 6.10, 8.4'''
status = '''ready'''
note_1_0 = '''length() on a text value yields the number of Unicode scalar values (SPEC 6.10), so length(.name) is 24: the guard passes and the 'length(.name) == 1' branch is not taken. length() of an int, float, bool, group, $(Schema) or ref field would be a static E514 instead of silently returning 1.'''
