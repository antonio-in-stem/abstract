note_1_0 = '''1.0: 'derive .owner.team.name' is checked statically in P3. '.owner' is declared text(1..40), so the segment 'team' names no field of any schema in scope and the derive target is rejected with E505 (SPEC 6.4: every segment MUST name a field declared by the schema in scope). The 2-segment form '.owner.team' is E505 for the same reason, so neither spelling can panic or be silently dropped.'''
