note_1_0 = ''''.caps.id' crosses the list field 'caps' without an index, so it can project several values. '!=' requires each operand to resolve to at most one value, which makes this a static E519 in P3, independent of any instance (SPEC 6.5). The supported spelling of the intent is 'require not .caps.id contains "banned"'.'''
