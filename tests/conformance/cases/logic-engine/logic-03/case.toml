note_1_0 = '''The stray '}' on line 10 closes the logic block (SPEC 3.6: a block brace is matched against its '}'). The 'require' on line 11 is then at template-file top level, where only schema_decl / logic_decl / versions_decl are allowed, so it is E210 (SPEC 4.1: there is no skip-unknown-line behaviour). Only the first diagnostic is pinned here: parser recovery is not specified, and an implementation that recovers also reports E210 for the 'derive' on line 12 and E205 for the '}' on line 13.'''
