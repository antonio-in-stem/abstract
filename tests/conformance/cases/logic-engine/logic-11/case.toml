note_1_0 = ''''for item in .tgas' is E210 at P1: the loop variable is missing its '$' (SPEC 6.9). Written as 'for $item in .tgas' it would be E503 at P3, because '.tgas' names no declared field (SPEC 6.5); a for over a path that resolves to no value runs zero times and never binds the path text as an item (SPEC 6.2).'''
