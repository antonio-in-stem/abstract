note_1_0 = '''A block's '{' MUST be the last token of its logical line and its '}' MUST be the first token of a logical line (SPEC 3.6, 6.3); the grammar spells this as logic_decl = "logic", schema_name, "{", NL, logic_body, "}". The one-line form is therefore E210 at the token after the '{', with a position, not a 'block was not closed' report at the end of the file.'''
