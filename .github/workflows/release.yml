name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    name: Compiler artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: abstract-linux-x64
            stage: cp target/release/abstract abstract-linux-x64
          - os: windows-latest
            asset: abstract-windows-x64.exe
            stage: Copy-Item target\release\abstract.exe abstract-windows-x64.exe
          # GitHub documents these as standard hosted runners for private
          # repositories, so each native asset is built on its own platform.
          - os: ubuntu-24.04-arm
            asset: abstract-linux-arm64
            stage: cp target/release/abstract abstract-linux-arm64
          - os: macos-15-intel
            asset: abstract-macos-x64
            stage: cp target/release/abstract abstract-macos-x64
          - os: macos-15
            asset: abstract-macos-arm64
            stage: cp target/release/abstract abstract-macos-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release tag matches Cargo version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME#v}" = "$version"
      - run: cargo test --locked
      - run: cargo build --release --locked --bin abstract
      - name: Name release asset
        run: ${{ matrix.stage }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  vscode:
    name: VS Code extension artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: cargo build --locked --bin abstract
        working-directory: .
      - run: npm test
      - name: Run against VS Code 1.92
        env:
          ABSTRACT_VSCODE_VERSION: '1.92.0'
        run: xvfb-run --auto-servernum npm run test:integration
      - name: Run against stable VS Code
        env:
          ABSTRACT_VSCODE_VERSION: stable
        run: xvfb-run --auto-servernum npm run test:integration
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: abstract-language-vsix
          path: vscode/*.vsix
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [compiler, vscode]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Include the release compatibility manifest
        run: cp release-manifest.json release-assets/release-manifest.json
      - name: Record release checksums
        working-directory: release-assets
        run: |
          mapfile -d '' artifacts < <(find . -maxdepth 1 -type f -print0 | sort -z)
          test "${#artifacts[@]}" -gt 0
          sha256sum "${artifacts[@]}" > SHA256SUMS.txt
      - name: Create draft release from verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Abstract $GITHUB_REF_NAME" \
            --draft \
            --generate-notes
