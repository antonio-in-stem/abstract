name: Verify downloaded release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true

permissions:
  contents: read

jobs:
  native-artifact:
    name: Verify ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: abstract-linux-x64
          - os: ubuntu-24.04-arm
            asset: abstract-linux-arm64
          - os: windows-latest
            asset: abstract-windows-x64.exe
          - os: macos-15-intel
            asset: abstract-macos-x64
          - os: macos-15
            asset: abstract-macos-arm64
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download this platform's artifact and its verification metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: >-
          gh release download "$RELEASE_TAG"
          --pattern "${{ matrix.asset }}"
          --pattern SHA256SUMS.txt
          --pattern release-manifest.json
          --dir release-check
      - name: Make the downloaded binary executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x "release-check/${{ matrix.asset }}"
      - name: Verify and exercise the shipped compiler
        shell: bash
        run: >-
          python scripts/verify-release.py
          --tag "$RELEASE_TAG"
          --asset "release-check/${{ matrix.asset }}"
          --checksums release-check/SHA256SUMS.txt
          --manifest release-check/release-manifest.json
          --automotive examples/tutorials/automotive
